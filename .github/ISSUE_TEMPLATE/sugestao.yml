name: Sugerir uma melhoria
description: Ideia de ajuste, tela ou função nova
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: O que você sugere
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Por que é útil
      description: Que problema resolve ou que ganho traz.
  - type: textarea
    id: source
    attributes:
      label: Documentação (para ajustes do Windows)
      description: Link da documentação oficial da Microsoft para a chave, política ou serviço. Ajustes sem documentação ou que desliguem Defender, Firewall ou UAC não são aceitos.
  - type: input
    id: windows-version
    attributes:
      label: Versão do Windows
      description: "Ex.: Windows 10 22H2, build 19045."
  - type: dropdown
    id: risk
    attributes:
      label: Risco estimado
      options:
        - Baixo
        - Médio
        - Alto
        - Não sei
